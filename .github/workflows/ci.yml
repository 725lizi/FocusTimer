name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (HarmonyOS)
    runs-on: ubuntu-latest
    env:
      # 鸿蒙命令行工具（内含 HarmonyOS SDK + hvigor + ohpm）
      HOS_CLT_DIR: ${{ github.workspace }}/command-line-tools
      # 工程 targetSdk 为 6.1.1(24)，请确保 Command Line Tools 版本匹配
      HOS_CLT_VERSION: "6.1.1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Cache HarmonyOS command-line-tools
        id: cache-sdk
        uses: actions/cache@v4
        with:
          path: command-line-tools
          key: harmonyos-clt-${{ env.HOS_CLT_VERSION }}

      - name: Download HarmonyOS command-line-tools
        if: steps.cache-sdk.outputs.cache-hit != 'true'
        shell: bash
        run: |
          # 华为官方 Command Line Tools 需登录开发者中心下载，GitHub Actions 无法直接使用。
          # 依次尝试：仓库 Secret 自定义直链 > 社区镜像（GitHub Releases / HuggingFace）。
          # 若默认源版本与工程 targetSdk 6.1.1(24) 不匹配导致构建失败，
          # 请在仓库 Settings -> Secrets 配置 SDK_DOWNLOAD_URL 指向正确版本直链。
          URLS="${{ secrets.SDK_DOWNLOAD_URL }} https://github.com/wxpusher/harmony-setup-sdk/releases/download/commandline-tools-linux-x64-6.0.2.650/commandline-tools-linux-x64-6.0.2.650.zip"
          for url in $URLS; do
            if curl -fSL -o clt.zip "$url"; then
              echo "downloaded from $url"
              break
            else
              echo "failed: $url"
            fi
          done
          test -f clt.zip
          unzip -q clt.zip
          rm clt.zip
          ls -la command-line-tools/bin

      - name: Configure environment
        shell: bash
        run: |
          echo "$GITHUB_WORKSPACE/command-line-tools/bin" >> "$GITHUB_PATH"
          echo "$GITHUB_WORKSPACE/command-line-tools/sdk/default/openharmony/toolchains" >> "$GITHUB_PATH"
          node -v
          ohpm -v
          hvigorw -v

      - name: Install dependencies (ohpm)
        shell: bash
        run: |
          ohpm config set registry https://ohpm.openharmony.cn/ohpm/
          ohpm install --all

      - name: Run unit tests (hypium)
        shell: bash
        run: |
          hvigorw test --mode module -p module=entry@default --no-daemon

      - name: Build HAP (debug)
        shell: bash
        run: |
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusTimer-unsigned-hap
          path: entry/build/default/outputs/default/*.hap
          if-no-files-found: warn
