name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-and-test:
    name: Build & Test (HarmonyOS 6.1.0)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 18
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 缓存鸿蒙命令行工具（约 2GB），命中可跳过下载
      - name: Cache Command Line Tools
        id: cache-tools
        uses: actions/cache@v4
        with:
          path: ./command-line-tools
          key: ${{ runner.os }}-harmony-tools-6.1.0.816

      # 缓存未命中时，从社区预发布镜像下载（与 targetSdk 6.1.1(24) 匹配）
      - name: Download Command Line Tools
        if: steps.cache-tools.outputs.cache-hit != 'true'
        run: |
          curl -L -o tools.zip https://github.com/Okysu/harmony-auto-build/releases/download/commandline-tools-linux-x64-6.1.0.816/commandline-tools-linux-x64-6.1.0.816.zip
          unzip tools.zip
          rm tools.zip

      - name: Setup Build Environment
        run: |
          TOOLS_DIR=$(pwd)/command-line-tools
          # 指定 SDK 路径，供 hvigor 构建工具读取
          echo "hwsdk.dir=$TOOLS_DIR/sdk" > local.properties
          # 将工具目录加入 PATH（内含 ohpm / hvigorw）
          echo "$TOOLS_DIR/bin" >> $GITHUB_PATH
          # 导出鸿蒙工具所需环境变量
          echo "OHPM_HOME=$TOOLS_DIR/ohpm" >> $GITHUB_ENV
          echo "HOS_SDK_HOME=$TOOLS_DIR/sdk" >> $GITHUB_ENV
          # 赋予工具脚本执行权限
          chmod -R +x $TOOLS_DIR/bin

      - name: Install Dependencies (ohpm)
        run: |
          ohpm install

      - name: Run unit tests (hypium)
        run: |
          hvigorw test --mode module -p module=entry@default --no-daemon

      - name: Build HAP (debug)
        run: |
          hvigorw assembleHap --mode module -p product=default -p buildMode=debug --no-daemon

      - name: Upload HAP artifact
        uses: actions/upload-artifact@v4
        with:
          name: FocusTimer-unsigned-hap
          path: |
            entry/build/default/outputs/**/*.hap
            **/build/**/outputs/**/*.hap
          if-no-files-found: warn
