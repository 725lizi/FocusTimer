name: Repository-Check

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:

jobs:
  repo-check:
    name: Repository Standards Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # 说明：HarmonyOS 官方 Command Line Tools / API 24 SDK 需登录华为开发者中心下载，
      # GitHub Actions 云端无法获取，因此云端 CI 不做 HAP 构建与单元测试。
      # 应用构建与 52 个单元测试请在本地 DevEco Studio 中执行。
      - name: Verify critical repository files
        run: |
          test -f LICENSE
          test -f README.md
          test -f oh-package.json5
          test -f build-profile.json5
          test -d entry/src/test
          test -d docs

      - name: Repository check passed
        run: |
          echo "OK - repository standards check passed."
          echo "Note: HarmonyOS build & unit tests require local DevEco Studio."
