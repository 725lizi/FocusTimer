name: 功能建议
description: 为 FocusTimer 提出新功能或改进建议
title: "[Feature] "
labels: ["enhancement"]
body:
  - type: textarea
    id: scenario
    attributes:
      label: 需求场景
      description: 说明在什么使用场景下遇到了什么问题
      placeholder: 例如：在图书馆无网络时，希望仍能查看历史专注统计
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 描述你期望的功能或改进方式
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: 考虑过的替代方案
      description: 选填，若有其他思路可一并说明
    validations:
      required: false

  - type: dropdown
    id: offline_impact
    attributes:
      label: 是否影响离线可用性
      options:
        - 不影响
        - 会削弱离线能力
        - 不确定
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 补充说明
      description: 选填，可附参考链接、草图或其他背景信息
    validations:
      required: false
